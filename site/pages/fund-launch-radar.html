<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fund Launch Radar</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/chrome.css">
  <link rel="stylesheet" href="/shared/fund-launch-radar.css">
</head>
<body class="flr-page">
  <div id="app">
    <div id="stage">
      <div id="globe-container"></div>
      <div id="globe-loading">Initialising radar…</div>
      <div id="err" hidden>
        <div class="box">
          <h3>Network map could not load</h3>
          <p>The country boundary data did not reach your browser. The live feed still works.</p>
          <button type="button" id="retry-geo">Retry loading map</button>
        </div>
      </div>
    </div>

    <div class="brand-block">
      <img src="/assets/brand/calastone-wordmark-black.png" alt="Calastone">
      <span class="brand-divider" aria-hidden="true"></span>
      <div class="subbrand">Fund Launch Radar</div>
    </div>

    <button type="button" id="activity-bell" class="activity-bell" aria-label="Activity notifications" title="Activity">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
        <path d="M10 19a2 2 0 0 0 4 0"></path>
      </svg>
      <span id="activity-badge" class="activity-badge" hidden>0</span>
    </button>

    <div class="legend" id="legend" aria-label="Alert categories">
      <h4>Order intelligence</h4>
      <button type="button" class="lg-item on" data-cat="regulatory" title="Filter Regulatory"><span class="lg-dot cat-reg" aria-hidden="true"></span><span class="lg-label">Regulatory</span><span class="lg-n" id="c-reg">0</span></button>
      <button type="button" class="lg-item on" data-cat="competitor" title="Filter Competitor"><span class="lg-dot cat-comp" aria-hidden="true"></span><span class="lg-label">Competitor</span><span class="lg-n" id="c-comp">0</span></button>
      <button type="button" class="lg-item on" data-cat="market" title="Filter Market"><span class="lg-dot cat-mkt" aria-hidden="true"></span><span class="lg-label">Market</span><span class="lg-n" id="c-mkt">0</span></button>
      <button type="button" class="lg-item on" data-cat="call" title="Filter Call note"><span class="lg-dot cat-call" aria-hidden="true"></span><span class="lg-label">Call note</span><span class="lg-n" id="c-call">0</span></button>
      <button type="button" class="lg-item on" data-cat="identifier" title="Filter Identifier"><span class="lg-dot cat-id" aria-hidden="true"></span><span class="lg-label">Identifier</span><span class="lg-n" id="c-id">0</span></button>
    </div>

    <div class="pills" role="group" aria-label="Globe controls">
      <button type="button" class="pill active" data-view="rotate">Auto-rotate</button>
      <button type="button" class="pill" data-view="pause">Pause spin</button>
      <button type="button" class="pill" data-view="reset">Reset view</button>
    </div>

    <aside id="feed-rail">
      <button type="button" id="feed-toggle" aria-label="Toggle live feed" aria-expanded="true">
        <span class="chev">›</span>
        <span class="pip"></span>
        <span class="vlabel">Live feed</span>
      </button>
      <div class="feed-kpis" aria-label="Alert summary">
        <div class="kpi">
          <span class="kpi-v" id="stat-alerts" data-count="0">0</span>
          <span class="kpi-k">Alerts</span>
        </div>
        <div class="kpi">
          <span class="kpi-v alert" id="stat-high">0</span>
          <span class="kpi-k">High priority</span>
        </div>
      </div>
      <div class="feed-head">
        <div class="ttl"><span class="live"></span><span id="feed-title">Live alert feed</span></div>
        <div class="sub" id="feed-sub"></div>
        <div class="region-filters" id="regionFilters">
          <button type="button" class="rf-btn active" data-region="all">All</button>
          <button type="button" class="rf-btn" data-region="emea">EMEA</button>
          <button type="button" class="rf-btn" data-region="americas">Americas</button>
          <button type="button" class="rf-btn" data-region="asia">Asia</button>
          <button type="button" class="rf-btn" data-region="australia">Australia</button>
        </div>
      </div>
      <div class="feed scroll" id="feed"></div>
    </aside>
  </div>

  <script type="application/json" id="isc-meta">
  {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.1/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <script src="/shared/chrome.js"></script>
  <script src="/shared/fund-launch-radar.js"></script>
</body>
</html>
