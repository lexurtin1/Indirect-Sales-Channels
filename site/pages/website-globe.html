<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Calastone network insights</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/chrome.css">
  <link rel="stylesheet" href="/shared/mcp-funnel.css">
</head>
<body class="mcp-funnel" data-variant="1a">
  <div class="variant-switch" id="variant-switch" role="group" aria-label="Hero layout options">
    <span>Layout</span>
    <button type="button" data-variant="1a" aria-pressed="true">1a</button>
    <button type="button" data-variant="1b" aria-pressed="false">1b</button>
    <button type="button" data-variant="1c" aria-pressed="false">1c</button>
  </div>

  <header class="site-header">
    <a class="logo" href="/" aria-label="Calastone home">
      <img src="/assets/brand/calastone-wordmark-black.png" alt="Calastone">
      <span class="tagline">An SS&amp;C Company</span>
    </a>
    <nav class="site-nav" aria-label="Calastone site">
      <span>About Calastone ⌄</span>
      <span>Solutions ⌄</span>
      <span class="hide-narrow">Clients ⌄</span>
      <span class="hide-narrow">Insights &amp; Events ⌄</span>
      <span>Contact Us</span>
    </nav>
  </header>

  <section class="hero-stage" id="hero" aria-label="Global network globe">
    <div class="globe-host" id="globe-host"></div>
    <div class="hero-overlay">
      <aside class="mcp-card hotspot" id="mcp-card" aria-label="Calastone MCP download"></aside>
      <div class="stat-block" id="stat-block">
        <span class="label">Global network · 2025</span>
        <div class="row">
          <span class="value" id="stat-value">0</span>
          <span class="unit">orders</span>
        </div>
        <span class="sub" id="stat-sub">51 countries · 321 corridors · 109.8m cross-border</span>
      </div>
      <div class="side-panel" id="side-panel"></div>
      <div class="controls" id="controls">
        <div class="seg" role="group" aria-label="Corridor filter">
          <button type="button" id="arcs-all" aria-pressed="true">All corridors</button>
          <button type="button" id="arcs-major" aria-pressed="false">Major corridors</button>
        </div>
        <button type="button" class="ctrl-btn" id="spin-toggle">Pause spin</button>
      </div>
    </div>
  </section>

  <script type="application/json" id="isc-meta">
  {}
  </script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="/shared/flows.js"></script>
  <script src="/shared/flow-globe.js"></script>
  <script src="/shared/chrome.js"></script>
  <script src="/shared/mcp-funnel.js"></script>
</body>
</html>
